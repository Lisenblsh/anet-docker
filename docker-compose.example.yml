services:
  anet-auth:
    #image: git.lisenblsh.art/lisenblsh/anet-auth:latest
    image: ghcr.io/lisenblsh/anet-auth:${ANET_VERSION:-latest}
    container_name: anet-auth
    restart: unless-stopped
    depends_on:
      - anet-db
    env_file:
      - .env
    networks:
      - anet_net
    expose:
      - "3000"

  anet-webui:
    image: ghcr.io/lisenblsh/anet-webui:${ANET_VERSION:-latest}
    container_name: anet-webui
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - anet-auth
    networks:
      - anet_net

  anet-server:
    #image: git.lisenblsh.art/lisenblsh/anet-server:latest
    image: ghcr.io/lisenblsh/anet-server:${ANET_VERSION:-latest}
    container_name: anet-server
    restart: unless-stopped
    volumes:
      - ./config:/app/config
    env_file:
      - .env
    networks:
      - anet_net
    ports:
      - "${SSH_PORT}:${SSH_PORT}"
      - "${QUIC_PORT}:${QUIC_PORT}/udp"
      - "${VNC_PORT}:${VNC_PORT}"
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    devices:
      - /dev/net/tun:/dev/net/tun

  anet-db:
    container_name: anet-db
    image: postgres:18
    env_file:
      - .env
    volumes:
      - ./pg_data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 2s
      timeout: 5s
      retries: 5  
    networks:
      - anet_net  
    restart: unless-stopped

networks:
  anet_net:
    name: anet_net
