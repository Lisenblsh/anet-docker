name: Build Docker image for anet-auth

on:
  push:
    branches: [ fork ]
    tags: [ "v*" ]
    paths:
      - 'anet-auth/**'
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}
  NAMESPACE: ${{ secrets.REGISTRY_USER }}
  IMAGE_NAME: anet-auth

jobs:
  build:
    runs-on: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare variables
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "MODE=dev" >> $GITHUB_ENV
          echo "SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "VERSION=dev_$SHORT_SHA" >> $GITHUB_ENV

      - name: Install docker into workflow
        run: apt-get update && apt-get install -y docker.io

      - name: Login to Forgejo Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login $REGISTRY -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build
        run: |
          docker build \
            --build-arg APP_VERSION=master \
            -t $REGISTRY/$NAMESPACE/$IMAGE_NAME:$VERSION \
            -t $REGISTRY/$NAMESPACE/$IMAGE_NAME:dev \
            ./$IMAGE_NAME

      - name: Push
        run: |
          docker push $REGISTRY/$NAMESPACE/$IMAGE_NAME:$VERSION
          docker push $REGISTRY/$NAMESPACE/$IMAGE_NAME:dev
